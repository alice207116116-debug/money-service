<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>홈 | 월여유</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    :root {
      --green: #4a968c;
      --green-dark: #2e7d72;
      --green-mid: #88b8bb;
      --green-light: #dce8e5;
      --teal: #0f8a84;
      --bg: #f4f4f4;
      --line: #e6e6e6;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: #222;
           -webkit-font-smoothing: antialiased; }
    a { text-decoration: none; color: inherit; }

    /* ===== 상단 바 (화이트 미니멀) ===== */
    .nav { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; height: 60px;
           padding: 0 38px; background: #fff; border-bottom: 1px solid #e6e6e6;
           animation: nav-in .5s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes nav-in { from { transform: translateY(-100%); opacity: 0; } }

    /* 로고 (월여유) */
    .nav-title { display: flex; align-items: center; gap: 9px; font-size: 19px; font-weight: 800; letter-spacing: -.5px;
                 color: #141414; margin-right: 44px; white-space: nowrap; }
    .logo { display: flex; flex-shrink: 0; }
    .logo svg { width: 12px; height: 30px; }

    .nav-menu { display: flex; gap: 8px; flex: 1; align-self: stretch; }
    .nav-menu a { position: relative; display: flex; align-items: center; padding: 0 14px; font-size: 14px;
                  color: #666; white-space: nowrap; transition: color .2s ease; }
    .nav-menu a::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: -1px; height: 2px;
                         background: var(--green-dark); transform: scaleX(0); transform-origin: left;
                         transition: transform .3s ease; }
    .nav-menu a:hover { color: var(--green-dark); }
    .nav-menu a:hover::after, .nav-menu a.active::after { transform: scaleX(1); }
    .nav-menu a.active { color: var(--green-dark); font-weight: 600; }

    /* 사용자 영역: 검색 · 알림 + 프로필 사진 */
    .nav-user { display: flex; align-items: center; gap: 6px; }
    .ib { position: relative; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px;
          border: 0; border-radius: 50%; background: none; color: #555; cursor: pointer; transition: background .2s ease, color .2s ease; }
    .ib:hover { background: #f2f5f4; color: var(--green-dark); }
    .ib svg { width: 21px; height: 21px; }
    .ib .dot { position: absolute; top: 9px; right: 10px; width: 7px; height: 7px; border-radius: 50%;
               background: #e0604f; box-shadow: 0 0 0 2px #fff; }
    .nav-sep { width: 1px; height: 22px; margin: 0 8px; background: #e6e6e6; }
    .login-btn { display: none; align-items: center; height: 38px; padding: 0 18px; border: 1.5px solid #dfe4e2; border-radius: 999px;
                 font-size: 14px; font-weight: 600; color: #222; white-space: nowrap; transition: border-color .2s ease, color .2s ease; }
    .login-btn:hover { border-color: var(--green-dark); color: var(--green-dark); }
    .nav.is-out .login-btn { display: inline-flex; }
    .nav.is-out .ib[aria-label="알림"], .nav.is-out .profile { display: none; }

    /* ===== 본문 ===== */
    .home { max-width: 1000px; margin: 0 auto; padding: 88px 24px 100px;
            display: flex; flex-direction: column; align-items: center; text-align: center; }

    .label { font-size: 22px; color: #555; }
    .amount { margin-top: 18px; font-size: 136px; font-weight: 700; letter-spacing: -4px; line-height: 1;
              color: var(--green-dark); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .hint { margin-top: 24px; font-size: 19px; color: #888; }

    /* 다음 결제 */
    .next { display: flex; align-items: center; gap: 16px; width: 100%; max-width: 720px; margin-top: 56px;
            padding: 28px 32px; background: #fff; border: 1px solid var(--line); border-radius: 24px;
            text-align: left; transition: border-color .2s ease, box-shadow .2s ease; }
    .next:hover { border-color: var(--green-mid); box-shadow: 0 8px 24px rgba(46,125,114,.08); }
    .next svg { width: 28px; height: 28px; flex-shrink: 0; color: var(--green-dark); }
    .next .what { flex: 1; min-width: 0; font-size: 20px; color: #333; }
    .next .money { font-size: 22px; font-weight: 700; white-space: nowrap; }


    /* 하단 2열 */
    .cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; width: 100%;
            margin-top: 72px; text-align: left; }
    .panel { min-width: 0; padding: 32px 34px; background: #fff; border: 1px solid var(--line); border-radius: 24px; }
    .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .panel h2 { font-size: 21px; font-weight: 700; }
    .panel-head span { font-size: 15px; color: #888; white-space: nowrap; }
    .panel-head span b { color: var(--green-dark); font-weight: 600; }

    /* 이번 주 지출 막대 */
    .week { position: relative; display: flex; align-items: flex-end; gap: 14px; height: 170px; margin-top: 30px;
            padding-bottom: 30px; }
    .limit { position: absolute; left: 0; right: 0; border-top: 1.5px dashed #b9cfcb; }
    .limit em { position: absolute; right: 0; top: -22px; font-style: normal; font-size: 12px; color: #8aa9a4; }
    .day { position: relative; flex: 1; height: 100%; display: flex; align-items: flex-end; justify-content: center; }
    .day i { display: block; width: 100%; max-width: 34px; border-radius: 8px 8px 4px 4px; background: var(--green-mid);
             transform-origin: bottom; transform: scaleY(0); animation: grow .8s cubic-bezier(.2,.7,.2,1) forwards; }
    .day i.over { background: #e08a7e; }
    .day i.today { background: var(--green-dark); }
    .day i.empty { height: 6px !important; background: #ececec; }
    .day span { position: absolute; bottom: -28px; font-size: 14px; color: #999; }
    .day.on span { color: var(--green-dark); font-weight: 700; }
    @keyframes grow { to { transform: scaleY(1); } }

    /* 최근 거래 */
    .tx { list-style: none; margin-top: 18px; }
    .tx li { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid #f0f0f0; }
    .tx li:last-child { border-bottom: 0; padding-bottom: 0; }
    .tx .ico { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px;
               border-radius: 50%; background: #d4ecea; flex-shrink: 0; }
    .tx .ico svg { width: 22px; height: 22px; stroke: var(--teal); fill: none; stroke-width: 2;
                   stroke-linecap: round; stroke-linejoin: round; }
    .tx .name { flex: 1; min-width: 0; font-size: 17px; }
    .tx .name small { display: block; margin-top: 2px; font-size: 13px; color: #999; }
    .tx .money { font-size: 17px; font-weight: 600; white-space: nowrap; }

    .up { opacity: 0; transform: translateY(14px); animation: up .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes up { to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) {
      .nav, .up { animation: none; opacity: 1; transform: none; }
      .day i { animation: none; transform: none; }
      .nav-menu a, .nav-menu a::after, .ib, .profile, .next { transition: none; }
    }

    @media (max-width: 860px) {
      .cols { grid-template-columns: 1fr; }
    }

    @media (max-width: 768px) {
      .nav { padding: 0 16px; }
      .nav-title { margin-right: 12px; }
      .nav-name { display: none; }
      .ib[aria-label="검색"], .nav-sep { display: none; }
      .logo svg { width: 11px; height: 28px; }
      .nav-menu { gap: 0; overflow-x: auto; }
      .nav-menu a { padding: 0 8px; font-size: 13px; }
      .nav-menu a::after { left: 8px; right: 8px; }
      .profile { width: 34px; height: 34px; }
      .home { padding: 52px 16px 72px; }
      .label { font-size: 18px; }
      .amount { font-size: 76px; letter-spacing: -2.5px; }
      .hint { font-size: 16px; }
      .next { margin-top: 40px; padding: 22px 20px; gap: 12px; border-radius: 20px; }
      .next svg { width: 24px; height: 24px; }
      .next .what { font-size: 16px; }
      .next .money { font-size: 18px; }
      .cols { margin-top: 48px; gap: 16px; }
      .panel { padding: 26px 22px; border-radius: 20px; }
      .week { gap: 8px; }
    }
  </style>
</head>

<body>

  <header class="nav">
    <div class="nav-title">
      <a href="./about.html" class="logo" aria-label="월여유 홈">
        <svg viewBox="0 0 14 34" aria-hidden="true"><circle cx="7" cy="7" r="7" fill="#c4e3dd"/><circle cx="7" cy="17" r="7" fill="#6fb3aa"/><circle cx="7" cy="27" r="7" fill="#2e7d72"/></svg>

    <nav class="nav-menu">

      </button>
      <button type="button" class="ib" aria-label="알림">

        <svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="4.2"/><path d="M3.5 22c1.2-4.6 4.6-7.2 8.5-7.2s7.3 2.6 8.5 7.2z"/></svg>
      </button>
      <a href="./login.html" class="login-btn">로그인</a>

  </header>
  <script>
    /* 지금 열린 페이지의 메뉴에만 밑줄 표시 */
    (function () {
      var page = location.pathname.split('/').pop() || 'home.html';
      document.querySelectorAll('.nav-menu a').forEach(function (a) {
        a.classList.toggle('active', a.getAttribute('href').replace('./', '') === page);
      });
    })();

    /* 로그인 상태에 따라 상단 오른쪽 바꾸기: 로그인 전 → '로그인' 버튼 / 로그인 후 → 알림 · 프로필 */
    (function () {
      var on = false;
      try { on = !!(localStorage.getItem('wolyeoyu-login') || sessionStorage.getItem('wolyeoyu-login')); } catch (e) {}
      document.querySelector('.nav').classList.add(on ? 'is-in' : 'is-out');
    })();
  </script>

  <main class="home">
    <p class="label up" style="animation-delay:.1s">오늘 쓸 수 있는 돈</p>
    <p class="amount up" style="animation-delay:.2s" data-count="60800">60,800원</p>
    <p class="hint up" style="animation-delay:.35s">남은 25일 동안 하루에 이만큼 쓰면 돼요</p>

    <a href="./dashboard.html" class="next up" style="animation-delay:.5s">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 14h2M8 17h2"/></svg>
      <span class="what">다음 결제 3일 뒤, 월세</span>

    <section class="cols up" style="animation-delay:.65s">

          <span>합계 <b>132,000원</b></span>
        </div>

          <div class="day"><i class="empty"></i><span>목</span></div>
          <div class="day"><i class="empty"></i><span>금</span></div>
          <div class="day"><i class="empty"></i><span>토</span></div>
          <div class="day"><i class="empty"></i><span>일</span></div>
        </div>
      </div>

      <!-- 최근 거래 -->
      <div class="panel">
        <div class="panel-head">
          <h2>최근 거래</h2>
          <a href="./salary.html"><span>더 보기 ›</span></a>
        </div>
        <ul class="tx">
          <li>
            <span class="ico"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M8 21v-3M16 21v-3"/></svg></span>

          </li>

            <span class="name">무신사<small>어제 21:35</small></span><span class="money">51,000원</span>
          </li>

    </section>
  </main>

  <script>
    (function () {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var el = document.querySelector('[data-count]');
      var target = parseFloat(el.dataset.count);
      el.textContent = '0원';
      setTimeout(function () {
        var start = performance.now();
        (function tick(now) {
          var t = Math.min((now - start) / 1200, 1);
          var v = Math.round(target * (1 - Math.pow(1 - t, 3)));
          el.textContent = v.toLocaleString('ko-KR') + '원';
          if (t < 1) requestAnimationFrame(tick);
        })(start);
      }, 300);
    })();
  </script>

  <script>
    /* ===== 알림 · 검색 (돋보기 누르면 검색창, 종 누르면 알림) ===== */
    (function () {
      var css = `
        .nav-user { position: relative; }
        @keyframes nx-pop { from { opacity: 0; transform: translateY(-6px); } }
        @keyframes nx-fade { from { opacity: 0; } }

        /* 알림 패널 */
        .noti { position: absolute; top: calc(100% + 12px); right: 0; z-index: 30; width: 360px; max-width: calc(100vw - 32px);
                padding: 8px; background: #fff; border: 1px solid #ececec; border-radius: 20px; white-space: normal;
                box-shadow: 0 24px 48px -16px rgba(20,60,55,.28); animation: nx-pop .18s ease; }
        .noti[hidden] { display: none; }
        .noti-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 8px; }
        .noti-head b { font-size: 16px; color: #141414; }
        .noti-read { border: 0; background: none; font: inherit; font-size: 13px; font-weight: 600; color: var(--green-dark); cursor: pointer; }
        .noti ul { list-style: none; }
        .noti li { position: relative; display: flex; gap: 12px; padding: 12px 14px; border-radius: 14px; }
        .noti li:hover { background: #f6f8f7; }
        .noti li.new::after { content: ""; position: absolute; top: 18px; right: 14px; width: 6px; height: 6px; border-radius: 50%; background: var(--green-dark); }
        .noti-ic { display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 36px; height: 36px;
                   border-radius: 50%; background: #e3f0ed; color: var(--green-dark); }
        .noti-ic.warn { background: #fdecea; color: #d4574a; }
        .noti-ic svg, .sch-ic svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .noti-txt small { font-size: 12px; color: #9a9a9a; }
        .noti-txt p { margin-top: 3px; padding-right: 14px; font-size: 14px; line-height: 1.45; color: #333; word-break: keep-all; }
        .noti-txt p b { color: #141414; }
        .noti-all { display: block; margin-top: 4px; padding: 12px; border-top: 1px solid #f0f0f0; text-align: center; font-size: 14px; color: #555; }
        .noti-all:hover { color: var(--green-dark); }

        /* 검색 창 */
        .sch { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-start; justify-content: center;
               padding: 88px 16px 16px; background: rgba(15,30,28,.32); backdrop-filter: blur(3px); animation: nx-fade .15s ease; }
        .sch[hidden] { display: none; }
        .sch-box { width: 100%; max-width: 620px; overflow: hidden; background: #fff; border-radius: 24px;
                   box-shadow: 0 40px 80px -20px rgba(0,0,0,.35); animation: nx-pop .2s ease; }
        .sch-input { display: flex; align-items: center; gap: 12px; height: 68px; padding: 0 22px; border-bottom: 1px solid #f0f0f0; }
        .sch-input svg { width: 22px; height: 22px; flex-shrink: 0; color: #9a9a9a; }
        .sch-input input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: inherit; font-size: 18px; color: #141414; }
        .sch-input input::placeholder { color: #b0b0b0; }
        .sch-input kbd { padding: 3px 7px; border: 1px solid #e3e3e3; border-radius: 6px; font: inherit; font-size: 11px; color: #999; cursor: pointer; }
        .sch-body { max-height: min(60vh, 460px); overflow-y: auto; padding: 14px 12px 16px; }
        .sch-label { padding: 6px 10px; font-size: 12px; font-weight: 600; color: #9a9a9a; }
        .sch-chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 10px 16px; }
        .sch-chips button { height: 34px; padding: 0 14px; border: 1px solid #e3e6e5; border-radius: 99px; background: #fff;
                            font: inherit; font-size: 14px; color: #444; cursor: pointer; }
        .sch-chips button:hover { border-color: var(--green); color: var(--green-dark); }
        .sch-item { display: flex; align-items: center; gap: 14px; padding: 12px 10px; border-radius: 14px; color: #141414; }
        .sch-item:hover, .sch-item.on { background: #f3f7f6; }
        .sch-ic { display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 38px; height: 38px;
                  border-radius: 12px; background: #e3f0ed; color: var(--green-dark); }
        .sch-txt { flex: 1; min-width: 0; }
        .sch-txt b { display: block; font-size: 15px; font-weight: 600; }
        .sch-txt small { font-size: 12px; color: #999; }
        .sch-item i { font-style: normal; color: #bbb; }
        .sch mark { background: none; color: var(--green-dark); font-weight: 800; }
        .sch-empty { padding: 40px 10px; text-align: center; font-size: 15px; color: #999; }

        @media (max-width: 768px) {
          .nav-user .ib[aria-label="검색"] { display: flex; }
          .noti { position: fixed; top: 68px; right: 12px; left: 12px; width: auto; max-width: none; }
          .sch { padding-top: 24px; }
        }
        @media (prefers-reduced-motion: reduce) {
          .noti, .sch, .sch-box { animation: none; }
        }
      `;
      var style = document.createElement('style');
      style.textContent = css;
      document.head.appendChild(style);

      var user = document.querySelector('.nav-user');
      var bell = document.querySelector('.ib[aria-label="알림"]');
      var searchBtn = document.querySelector('.ib[aria-label="검색"]');
      if (!user || !bell || !searchBtn) return;

      /* 공통 도구 */
      function pick(arr, n) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
        return a.slice(0, n);
      }
      function esc(s) { return s.replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
      var ICON = {
        cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
        coin: '<circle cx="12" cy="12" r="9"/><path d="M14.5 9.5h-3.2a1.8 1.8 0 0 0 0 3.6h1.4a1.8 1.8 0 0 1 0 3.6H9.5M12 7v1.8M12 16.7v1.8"/>',
        card: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
        alert: '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
        target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>',
        trend: '<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
        chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
        info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
        gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>'
      };
      function svg(name) { return '<svg viewBox="0 0 24 24">' + ICON[name] + '</svg>'; }

      /* ---------- 알림 ---------- */
      var NOTI = [
        { i: 'cal',    k: '결제 예정',   t: '월세 <b>500,000원</b>이 3일 뒤 빠져나가요' },
        { i: 'coin',   k: '오늘 예산',   t: '오늘 쓸 수 있는 돈은 <b>60,800원</b>이에요' },
        { i: 'alert',  k: '예산 초과',   t: '화요일에 하루 예산을 <b>10,300원</b> 넘었어요', warn: true },
        { i: 'target', k: '저축',       t: '이번 달 저축 목표의 <b>39.5%</b>를 달성했어요' },
        { i: 'cal',    k: '결제 예정',   t: '통신비 <b>55,000원</b>이 10월 15일에 결제돼요' },
        { i: 'card',   k: '결제 완료',   t: '스타벅스에서 <b>4,800원</b>이 결제됐어요' },
        { i: 'trend',  k: '지출 리포트', t: '이번 주 지출이 지난주보다 <b>12%</b> 줄었어요' },
        { i: 'coin',   k: '월급',       t: '월급날까지 <b>18일</b> 남았어요' },
        { i: 'cal',    k: '결제 예정',   t: '구독 서비스 <b>17,900원</b>이 21일에 결제돼요' },
        { i: 'card',   k: '결제 완료',   t: '무신사에서 <b>51,000원</b>이 결제됐어요' }
      ];
      var TIMES = ['방금 전', '12분 전', '1시간 전', '3시간 전', '어제'];

      var noti = document.createElement('div');
      noti.className = 'noti';
      noti.hidden = true;
      user.appendChild(noti);

      function renderNoti() {
        var list = pick(NOTI, 4);
        var unread = bell.querySelector('.dot') ? 1 + Math.floor(Math.random() * 3) : 0;
        noti.innerHTML =
          '<div class="noti-head"><b>알림</b><button type="button" class="noti-read">모두 읽음</button></div>' +
          '<ul>' + list.map(function (n, idx) {
            return '<li class="' + (idx < unread ? 'new' : '') + '">' +
                     '<span class="noti-ic' + (n.warn ? ' warn' : '') + '">' + svg(n.i) + '</span>' +
                     '<div class="noti-txt"><small>' + n.k + ' · ' + TIMES[idx] + '</small><p>' + n.t + '</p></div>' +
                   '</li>';
          }).join('') + '</ul>' +
          '<a class="noti-all" href="./dashboard.html">전체 알림 보기</a>';
        noti.querySelector('.noti-read').addEventListener('click', function () {
          noti.querySelectorAll('li.new').forEach(function (li) { li.classList.remove('new'); });
          var dot = bell.querySelector('.dot');
          if (dot) dot.remove();
        });
      }

      function closeNoti() { noti.hidden = true; bell.setAttribute('aria-expanded', 'false'); }
      bell.setAttribute('aria-expanded', 'false');
      bell.addEventListener('click', function (e) {
        e.stopPropagation();
        if (noti.hidden) { renderNoti(); noti.hidden = false; bell.setAttribute('aria-expanded', 'true'); }
        else closeNoti();
      });
      noti.addEventListener('click', function (e) { e.stopPropagation(); });
      document.addEventListener('click', closeNoti);

      /* ---------- 검색 (돋보기) ---------- */
      var PAGES = [
        { t: '오늘 쓸 수 있는 돈', d: '홈',        u: './home.html',      i: 'coin',   k: '하루 예산 오늘' },
        { t: '이번 주 지출',       d: '홈',        u: './home.html',      i: 'trend',  k: '주간 지출 그래프' },
        { t: '최근 거래',          d: '홈',        u: './home.html',      i: 'card',   k: '버스 스타벅스 무신사 결제' },
        { t: '정기지출',           d: '대시보드',   u: './dashboard.html', i: 'cal',    k: '월세 교통비 구독료 고정지출' },
        { t: '이번 달 사용 계획',   d: '대시보드',   u: './dashboard.html', i: 'target', k: '식비 약속 취미 쇼핑' },
        { t: '이번 달 수입',       d: '대시보드',   u: './dashboard.html', i: 'coin',   k: '월급 수입' },
        { t: '지출 현황',          d: '월급 관리',  u: './salary.html',    i: 'trend',  k: '월세 교통비 기타 총 지출' },
        { t: '저축 목표',          d: '월급 관리',  u: './salary.html',    i: 'target', k: '저축 목표 관리' },
        { t: '자산 현황',          d: '월급 관리',  u: './salary.html',    i: 'trend',  k: '총 자산' },
        { t: '채팅 상담',          d: '고객센터',   u: './support.html',   i: 'chat',   k: '상담 문의 전화' },
        { t: '자주 묻는 질문',      d: '고객센터',   u: './support.html',   i: 'info',   k: 'FAQ 도움말' },
        { t: '서비스 소개',        d: '소개',       u: './about.html',     i: 'info',   k: '소개 처음' },
        { t: '월급일 변경',        d: '설정',       u: '#',                i: 'gear',   k: '월급 정보 설정' },
        { t: '알림 설정',          d: '설정',       u: '#',                i: 'gear',   k: '알림 푸시' }
      ];
      var HOT = ['월세', '저축 목표', '월급일 변경', '구독료', '교통비', '이번 주 지출', '채팅 상담', '자산', '식비', '최근 거래'];

      var sch = document.createElement('div');
      sch.className = 'sch';
      sch.hidden = true;
      sch.innerHTML =
        '<div class="sch-box" role="dialog" aria-label="검색">' +
          '<label class="sch-input">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>' +
            '<input type="text" placeholder="메뉴, 기능, 지출 항목을 검색해 보세요">' +
            '<kbd>ESC</kbd>' +
          '</label>' +
          '<div class="sch-body"></div>' +
        '</div>';
      document.body.appendChild(sch);
      var input = sch.querySelector('input');
      var body = sch.querySelector('.sch-body');

      function items(list, q) {
        return list.map(function (p, idx) {
          var title = esc(p.t);
          if (q) title = title.replace(new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<mark>$1</mark>');
          return '<a class="sch-item' + (idx === 0 && q ? ' on' : '') + '" href="' + p.u + '">' +
                   '<span class="sch-ic">' + svg(p.i) + '</span>' +
                   '<span class="sch-txt"><b>' + title + '</b><small>' + p.d + '</small></span><i>→</i>' +
                 '</a>';
        }).join('');
      }

      function renderSearch() {
        var raw = input.value.trim();
        var q = raw.toLowerCase();
        if (!q) {
          body.innerHTML =
            '<p class="sch-label">추천 검색어</p>' +
            '<div class="sch-chips">' + pick(HOT, 5).map(function (h) { return '<button type="button">' + h + '</button>'; }).join('') + '</div>' +
            '<p class="sch-label">바로가기</p>' + items(pick(PAGES, 3), '');
          body.querySelectorAll('.sch-chips button').forEach(function (b) {
            b.addEventListener('click', function () { input.value = b.textContent; renderSearch(); input.focus(); });
          });
          return;
        }
        var res = PAGES.filter(function (p) { return (p.t + ' ' + p.d + ' ' + p.k).toLowerCase().indexOf(q) > -1; });
        body.innerHTML = res.length
          ? '<p class="sch-label">검색 결과 ' + res.length + '개</p>' + items(res, esc(raw))
          : '<p class="sch-empty">‘' + esc(raw) + '’에 대한 결과가 없어요</p>';
      }

      function openSearch() { closeNoti(); input.value = ''; renderSearch(); sch.hidden = false; setTimeout(function () { input.focus(); }, 30); }
      function closeSearch() { sch.hidden = true; }

      searchBtn.addEventListener('click', function (e) { e.stopPropagation(); openSearch(); });
      sch.addEventListener('click', function (e) { if (e.target === sch) closeSearch(); });
      sch.querySelector('kbd').addEventListener('click', closeSearch);
      input.addEventListener('input', renderSearch);
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { var first = body.querySelector('.sch-item'); if (first) first.click(); }
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { closeSearch(); closeNoti(); }
      });
    })();
  </script>

</body>
