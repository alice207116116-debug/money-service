<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 | 월여유</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    :root {
      --green: #4a968c;
      --green-dark: #2e7d72;
      --green-mid: #88b8bb;
      --green-light: #dce8e5;
      --bg: #f4f4f4;
      --line: #e3e6e5;
      --red: #d4574a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { font-family: 'Pretendard', sans-serif; background: #fff; color: #141414; -webkit-font-smoothing: antialiased; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; }

    .page { min-height: 100%; background: #f6f8f7; }

    /* ===== 로그인 ===== */
    .side { display: flex; flex-direction: column; min-height: 100vh; padding: 32px 48px; }
    .side-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; color: #888; }
    .side-top a { font-weight: 700; color: var(--green-dark); }
    .side-top a.m-logo { color: #141414; }
    .form-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 0; }
    .form { width: 100%; max-width: 440px; padding: 44px 40px 40px; background: #fff; border-radius: 28px;
            box-shadow: 0 1px 2px rgba(0,0,0,.03), 0 24px 56px -20px rgba(20,60,55,.18); }
    .form-logo { margin-bottom: 22px; }
    .badge.lg svg { width: 20px; height: 48px; }
    .form h2 { font-size: 32px; font-weight: 800; letter-spacing: -1px; }
    .form .sub { margin-top: 10px; font-size: 16px; color: #888; }

    .field { margin-top: 28px; }
    .field + .field { margin-top: 18px; }
    .field label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: #444; }
    .input { position: relative; }
    .input input { width: 100%; height: 56px; padding: 0 18px; border: 1.5px solid var(--line); border-radius: 14px;
                   background: #fff; font: inherit; font-size: 16px; color: #141414; outline: 0;
                   transition: border-color .2s ease, box-shadow .2s ease; }
    .input input::placeholder { color: #b5b5b5; }
    .input input:focus { border-color: var(--green-dark); box-shadow: 0 0 0 4px rgba(46,125,114,.12); }
    .field.error input { border-color: var(--red); box-shadow: 0 0 0 4px rgba(212,87,74,.1); }
    .msg { display: none; margin-top: 8px; font-size: 13px; color: var(--red); }
    .field.error .msg { display: block; }
    .eye { position: absolute; top: 50%; right: 10px; transform: translateY(-50%); display: flex; align-items: center; justify-content: center;
           width: 38px; height: 38px; border: 0; border-radius: 10px; background: none; color: #999; }
    .eye:hover { background: #f3f5f4; color: var(--green-dark); }
    .eye svg { width: 20px; height: 20px; }
    .eye .off { display: none; }
    .eye.on .on { display: none; }
    .eye.on .off { display: block; }

    .row { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; font-size: 14px; }
    .check { display: inline-flex; align-items: center; gap: 8px; color: #555; cursor: pointer; user-select: none; }
    .check input { width: 18px; height: 18px; accent-color: var(--green-dark); }
    .row a { color: #888; }
    .row a:hover { color: var(--green-dark); }

    .submit { position: relative; width: 100%; height: 58px; margin-top: 28px; border: 0; border-radius: 14px;
              background: #141414; color: #fff; font-size: 17px; font-weight: 700; transition: background .25s ease, transform .2s ease; }
    .submit:hover { background: var(--green-dark); }
    .submit:active { transform: scale(.99); }
    .submit.loading { color: transparent; pointer-events: none; background: var(--green-dark); }
    .submit.loading::after { content: ""; position: absolute; top: 50%; left: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px;
                             border: 2.5px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .or { display: flex; align-items: center; gap: 14px; margin: 30px 0 18px; font-size: 13px; color: #aaa; }
    .or::before, .or::after { content: ""; flex: 1; height: 1px; background: #ececec; }
    .social { display: grid; gap: 10px; }
    .social button { display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; border-radius: 14px; font-size: 15px; font-weight: 600; transition: filter .2s ease, border-color .2s ease; }
    .social .kakao { border: 0; background: #fee500; color: #191919; }
    .social .naver { border: 0; background: #03c75a; color: #fff; }
    .social .apple { border: 1.5px solid var(--line); background: #fff; color: #141414; }
    .social button:hover { filter: brightness(.96); }
    .social .sns { width: 20px; height: 20px; object-fit: contain; }
    .social .apple:hover { border-color: #c9cfcd; filter: none; }

    .foot { text-align: center; font-size: 12px; color: #aaa; }
    .foot a { text-decoration: underline; }

    /* 등장 애니메이션 */
    .up { opacity: 0; transform: translateY(14px); animation: up .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes up { to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) {
      .up { animation: none; opacity: 1; transform: none; }
      .submit, .input input, .social button { transition: none; }
    }

    /* 로고 */
    .m-logo { display: inline-flex; align-items: center; gap: 9px; font-size: 20px; font-weight: 800; letter-spacing: -.5px; color: #141414; }
    .badge { display: flex; align-items: center; }
    .badge svg { width: 13px; height: 32px; }

    @media (max-width: 600px) {
      .side { padding: 20px 16px; }
      .page { background: #fff; }
      .form { padding: 8px 4px 24px; box-shadow: none; border-radius: 0; }
    }
    @media (max-width: 480px) {
      .form h2 { font-size: 28px; }
      .side-top .ask { display: none; }
    }
  </style>
</head>

<body>
  <div class="page">

    <!-- 로그인 -->
    <main class="side">
      <div class="side-top">
        <a href="./about.html" class="m-logo">
          <span class="badge"><svg viewBox="0 0 14 34" aria-hidden="true"><circle cx="7" cy="7" r="7" fill="#c4e3dd"/><circle cx="7" cy="17" r="7" fill="#6fb3aa"/><circle cx="7" cy="27" r="7" fill="#2e7d72"/></svg></span>
          <span>월여유</span>
        </a>
        <span><span class="ask">처음이신가요?</span> <a href="#">회원가입</a></span>
      </div>

      <div class="form-wrap">
        <form class="form" id="loginForm" novalidate>
          <div class="form-logo up" style="animation-delay:.05s"><span class="badge lg"><svg viewBox="0 0 14 34" aria-hidden="true"><circle cx="7" cy="7" r="7" fill="#c4e3dd"/><circle cx="7" cy="17" r="7" fill="#6fb3aa"/><circle cx="7" cy="27" r="7" fill="#2e7d72"/></svg></span></div>
          <h2 class="up" style="animation-delay:.1s">월여유에 다시 오셨네요</h2>
          <p class="sub up" style="animation-delay:.15s">이메일과 비밀번호로 로그인해 주세요.</p>

          <div class="field up" style="animation-delay:.2s" id="f-email">
            <label for="email">이메일</label>
            <div class="input"><input id="email" type="email" placeholder="example@email.com" autocomplete="email"></div>
            <p class="msg">올바른 이메일 주소를 입력해 주세요.</p>
          </div>

          <div class="field up" style="animation-delay:.25s" id="f-pw">
            <label for="pw">비밀번호</label>
            <div class="input">
              <input id="pw" type="password" placeholder="비밀번호 입력" autocomplete="current-password">
              <button type="button" class="eye" aria-label="비밀번호 보기">
                <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a9.9 9.9 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
              </button>
            </div>
            <p class="msg">비밀번호는 8자 이상 입력해 주세요.</p>
          </div>

          <div class="row up" style="animation-delay:.3s">
            <label class="check"><input type="checkbox" checked> 로그인 상태 유지</label>
            <a href="#">비밀번호 찾기</a>
          </div>

          <button type="submit" class="submit up" style="animation-delay:.35s">로그인</button>

          <div class="or up" style="animation-delay:.4s">또는</div>
          <div class="social up" style="animation-delay:.45s">
            <button type="button" class="kakao"><img class="sns" src="./img/kakao-symbol.png" alt="" onerror="this.remove()">카카오로 계속하기</button>
            <button type="button" class="naver"><img class="sns" src="./img/naver-symbol.png" alt="" onerror="this.remove()">네이버로 계속하기</button>
            <button type="button" class="apple">Apple로 계속하기</button>
          </div>
        </form>
      </div>

      <p class="foot">로그인하면 <a href="#">이용약관</a> 및 <a href="#">개인정보 처리방침</a>에 동의하게 돼요.</p>
    </main>

  </div>

  <script>
    (function () {
      var form = document.getElementById('loginForm');
      var email = document.getElementById('email');
      var pw = document.getElementById('pw');
      var eye = document.querySelector('.eye');
      var submit = form.querySelector('.submit');

      /* 비밀번호 보기 / 숨기기 */
      eye.addEventListener('click', function () {
        var show = pw.type === 'password';
        pw.type = show ? 'text' : 'password';
        eye.classList.toggle('on', show);
        eye.setAttribute('aria-label', show ? '비밀번호 숨기기' : '비밀번호 보기');
      });

      /* 입력 검사 */
      function check() {
        var okEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());
        var okPw = pw.value.length >= 8;
        document.getElementById('f-email').classList.toggle('error', !okEmail);
        document.getElementById('f-pw').classList.toggle('error', !okPw);
        return okEmail && okPw;
      }
      [email, pw].forEach(function (el) {
        el.addEventListener('input', function () { el.closest('.field').classList.remove('error'); });
      });

      /* 로그인 처리 → 성공하면 홈으로 자동 이동 */
      var KEY = 'wolyeoyu-login';
      var keep = form.querySelector('.check input');
      function saveLogin() {
        try {
          var store = keep.checked ? localStorage : sessionStorage;
          store.setItem(KEY, JSON.stringify({ email: email.value.trim(), at: Date.now() }));
        } catch (err) { /* 저장이 막힌 브라우저에서도 이동은 그대로 */ }
      }
      function goHome() { location.replace('./home.html'); }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!check()) { (document.querySelector('.field.error input') || email).focus(); return; }
        submit.classList.add('loading');
        saveLogin();
        setTimeout(goHome, 900);
      });

      /* 간편 로그인 (데모) */
      document.querySelectorAll('.social button').forEach(function (b) {
        b.addEventListener('click', function () {
          b.style.opacity = '.7';
          try { localStorage.setItem(KEY, JSON.stringify({ email: b.className, at: Date.now() })); } catch (err) {}
          setTimeout(goHome, 600);
        });
      });

      /* 이미 로그인한 상태로 이 페이지에 오면 바로 홈으로 */
      try {
        if (localStorage.getItem(KEY) || sessionStorage.getItem(KEY)) goHome();
      } catch (err) {}
    })();
  </script>
</body>
</html>
